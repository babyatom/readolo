<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Strategy Call | READOLO</title>
    <meta name="description" content="Book a strategy call to discuss a premium custom Shopify or WooCommerce build. We respond with clear scope, timelines, and next steps.">
    <meta property="og:title" content="Book a Strategy Call | READOLO">
    <meta property="og:description" content="Book a strategy call to discuss a premium custom Shopify or WooCommerce build.">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Book a Strategy Call | READOLO">
    <meta name="twitter:description" content="Book a strategy call to discuss a premium custom Shopify or WooCommerce build.">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon-readolo.svg">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
</head>

<body>
    <div id="nav-placeholder"></div>

    <header class="hero" style="min-height: 40vh;">
        <div class="container">
            <div class="hero-content">
                <span class="eyebrow">Book a strategy call</span>
                <h1>Let's scope your ecommerce build.</h1>
                <p>Share your store goals and constraints. We will outline scope, timing, and the smartest path to a
                    premium build.</p>
            </div>
        </div>
    </header>

    <section class="services">
        <div class="container">
            <div class="grid">
                <div class="card">
                    <h3>General Enquiries</h3>
                    <p>contact@readolo.com</p>
                    <p>+61 2 9000 0000</p>
                </div>
                <div class="card" style="grid-column: span 2;">
                    <h3>Send a Message</h3>
                    <form id="contact-form" method="POST" action="https://formspree.io/f/xbdzkqnj"
                        style="display: flex; flex-direction: column; gap: 1rem;">
                        <input type="text" name="name" placeholder="Full Name" required
                            style="padding: 1rem; border: 1px solid #ddd;">
                        <input type="email" name="email" placeholder="Email Address" required
                            style="padding: 1rem; border: 1px solid #ddd;">
                        <textarea name="message" placeholder="How can we help?" required
                            style="padding: 1rem; border: 1px solid #ddd; height: 120px;"></textarea>
                        <div id="form-status" style="font-size: 0.9rem; color: #555;"></div>
                        <button type="submit" class="btn-main" style="border:none; cursor:pointer;">Request a
                            Call</button>
                    </form>
                </div>
            </div>
        </div>
    </section>
    <div id="footer-placeholder"></div>
    <script src="script.js"></script>
</body>

</html>
